  <!-- roads -->
  <line x1="20" y1="220" x2="780" y2="220" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="20" x2="220" y2="430" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="20" x2="430" y2="430" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="660" y1="20" x2="700" y2="430" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- markers -->
  <g transform="translate(520,170)">
    <circle r="18" fill="#2563eb" opacity="0.18"/>
    <circle r="10" fill="#2563eb" stroke="#fff" stroke-width="3"/>
    <text y="-18" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700" font-family="Inter,system-ui,sans-serif">ODC-SPG-01</text>
  </g>
  <g transform="translate(650,250)">
