<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa Password · AWG-UIKIT-RACING</title>
<link rel="stylesheet" href="../../css/awg-uikit.css">
<link rel="icon" href="../../assets/icons.svg#ic-flag">
<script>try{const t=localStorage.getItem('awg-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
.awg-auth-wall{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(135deg,var(--awg-brand-grad),var(--awg-ink));}
.awg-auth-card{width:100%;max-width:420px;background:var(--awg-surface);border:1px solid var(--awg-line);border-radius:var(--awg-radius-lg);box-shadow:var(--awg-shadow-lg);overflow:hidden;}
.awg-auth-head{padding:1.75rem 1.5rem .5rem;text-align:center;}
.awg-auth-head .logo{width:56px;height:56px;border-radius:14px;background:var(--awg-brand-grad);display:grid;place-items:center;color:#fff;margin:0 auto .75rem;}
.awg-auth-head h1{font-size:1.2rem;margin:0;}
.awg-auth-head p{font-size:.82rem;color:var(--awg-ink-3);margin:.25rem 0 0;}
.awg-auth-body{padding:1.25rem 1.5rem 1.5rem;}
.awg-auth-foot{padding:1rem 1.5rem 1.25rem;border-top:1px solid var(--awg-line);text-align:center;background:var(--awg-surface-2);}
</style>
</head>
<body>
<div class="awg-auth-wall">
<div class="awg-auth-card">
<div class="awg-auth-head">
    <div class="logo"><svg class="awg-ic" style="width:1.6rem;height:1.6rem"><use href="../../assets/icons.svg#ic-flag"></use></svg></div>
    <h1>Reset password</h1>
    <p>Masukkan email terdaftar; kami akan kirimkan tautan reset.</p>
</div>
<div class="awg-auth-body">
    <div class="awg-alert info awg-mb-2"><svg class="awg-ic"><use href="../../assets/icons.svg#ic-info"></use></svg> Demo: berkas ini tidak mengirim email nyata.</div>
    <form data-awg-validate novalidate onsubmit="event.preventDefault();Awg.toast('Tautan reset telah dikirim (demo)','ok');">
        <div class="awg-field">
            <label class="awg-label">Email terdaftar <span class="req">*</span></label>
            <input class="awg-input" type="email" name="email" placeholder="noc@awgnet.id" required data-awg-email>
            <div class="awg-error"></div>
        </div>
        <button class="awg-btn awg-btn-primary awg-btn-lg awg-btn-block awg-mb-2" type="submit"><svg class="awg-ic"><use href="../../assets/icons.svg#ic-mail"></use></svg> Kirim Tautan Reset</button>
        <div class="awg-text-c"><a href="login.html">← Kembali ke login</a></div>
    </form>
</div>
</div>
</div>
<script src="../../js/awg-core.js"></script>
</body>
</html>
